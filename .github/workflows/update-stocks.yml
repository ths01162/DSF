name: Update KRX 1,500 Stocks Daily Data

on:
  schedule:
    # 평일(월~금) 한국시간(KST) 오후 4시 10분 (장 마감 후 종가 확정 시점, UTC 07:10) 자동 실행
    - cron: '10 7 * * 1-5'
  workflow_dispatch:
    # GitHub 저장소의 Actions 탭에서 언제든 수동 즉시 실행 가능

permissions:
  contents: write

jobs:
  update-stocks-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch latest 65-trading-day OHLCV & Sector data for KRX Top 1,500 stocks
        run: python3 scripts/update_stocks.py

      - name: Commit and push updated stocks_data.js
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if git diff --quiet stocks_data.js; then
            echo "변경된 시세 데이터가 없습니다."
          else
            git add stocks_data.js
            git commit -m "chore(data): KRX 1,500대 종목 65거래일 일봉 및 섹터 데이터 자동 최신화 ($(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M KST'))"
            git push
          fi
